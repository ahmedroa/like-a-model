<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960" role="img" aria-label="مساحة صورة الواجهة الرئيسية">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E2E52"/>
      <stop offset="45%" stop-color="#5C1F3D"/>
      <stop offset="100%" stop-color="#240C19"/>
    </linearGradient>
    <radialGradient id="hp-glow" cx="72%" cy="22%" r="62%">
      <stop offset="0" stop-color="#C77D9E" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C77D9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hp-gold" cx="18%" cy="88%" r="55%">
      <stop offset="0" stop-color="#C9A46A" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#C9A46A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hp-fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160710" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#160710" stop-opacity=".92"/>
    </linearGradient>
    <pattern id="hp-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" opacity=".07"/>
    </pattern>
  </defs>

  <rect width="720" height="960" fill="url(#hp-bg)"/>
  <rect width="720" height="960" fill="url(#hp-glow)"/>
  <rect width="720" height="960" fill="url(#hp-gold)"/>
  <rect width="720" height="960" fill="url(#hp-dots)"/>

  <!-- أقواس ذهبية -->
  <g fill="none" stroke="#C9A46A" opacity=".42">
    <circle cx="500" cy="330" r="238" stroke-width="1"/>
    <circle cx="500" cy="330" r="176" stroke-width="1" opacity=".6"/>
    <path d="M-40 700 Q 250 560 760 690" stroke-width="1" opacity=".5"/>
    <path d="M-40 760 Q 250 620 760 750" stroke-width="1" opacity=".3"/>
  </g>

  <!-- ظل شخصية رياضية مجرّدة -->
  <g fill="url(#hp-fig)">
    <ellipse cx="368" cy="286" rx="52" ry="60"/>
    <path d="M368 350c-62 0-104 34-116 92l-24 118c-4 20 8 34 27 34h20l16 214c2 22 16 34 36 34s34-13 35-35l10-158h10l10 158c1 22 15 35 35 35s34-12 36-34l16-214h20c19 0 31-14 27-34l-24-118c-12-58-54-92-116-92z"/>
    <path d="M256 452c-16 44-26 92-30 144-2 22 10 36 28 36 16 0 27-10 30-30 7-48 16-90 28-126z"/>
    <path d="M480 452c16 44 26 92 30 144 2 22-10 36-28 36-16 0-27-10-30-30-7-48-16-90-28-126z"/>
  </g>

  <!-- تدرج سفلي لدمج الصورة مع الشارة -->
  <rect y="640" width="720" height="320" fill="#160710" opacity=".28"/>

  <g font-family="Tajawal, Segoe UI, Tahoma, sans-serif" text-anchor="middle" fill="#E3CFA5">
    <text x="360" y="884" font-size="21" font-weight="700" opacity=".85">صورة Lifestyle</text>
    <text x="360" y="916" font-size="15" opacity=".55">استبدلي هذا الملف بصورة بنسبة 3:4</text>
  </g>
</svg>
