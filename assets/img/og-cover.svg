<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Like A Model">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1226"/>
      <stop offset="55%" stop-color="#240C19"/>
      <stop offset="100%" stop-color="#160710"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="78%" cy="18%" r="60%">
      <stop offset="0" stop-color="#9B3B67" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#9B3B67" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-gold" cx="10%" cy="95%" r="50%">
      <stop offset="0" stop-color="#C9A46A" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#C9A46A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-gold)"/>

  <g fill="none" stroke="#C9A46A" opacity=".28">
    <circle cx="985" cy="150" r="230" stroke-width="1"/>
    <circle cx="985" cy="150" r="165" stroke-width="1" opacity=".6"/>
  </g>

  <g font-family="Tajawal, Segoe UI, Tahoma, sans-serif" fill="#FFFFFF">
    <text x="1120" y="150" text-anchor="end" font-size="22" font-weight="700"
          fill="#C9A46A" letter-spacing="6">LIKE A MODEL</text>
    <text x="1120" y="290" text-anchor="end" font-size="66" font-weight="900">رحلتك نحو</text>
    <text x="1120" y="378" text-anchor="end" font-size="66" font-weight="900" fill="#C9A46A">أفضل نسخة منكِ</text>
    <text x="1120" y="462" text-anchor="end" font-size="28" fill="#E3CCD7" opacity=".9">تدريب · تغذية · متابعة · قياس نتائج</text>
  </g>

  <rect x="80" y="527" width="1040" height="1" fill="#C9A46A" opacity=".3"/>
</svg>
